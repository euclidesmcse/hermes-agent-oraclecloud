version: '3.8'

services:
  reverse-proxy:
    image: nginx:alpine
    container_name: reverse-proxy
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - proxy-net
    restart: unless-stopped
    # FinOps Resource Limits: Keep footprint extremely small for Nginx
    deploy:
      resources:
        limits:
          cpus: '0.15'
          memory: 64M
        reservations:
          memory: 16M

networks:
  proxy-net:
    external: true
